name: Bug report
description: Something in the hub or one of the games isn't working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. The more precisely you can say what happened, the faster it gets fixed.
  - type: input
    id: game
    attributes:
      label: Which game?
      description: The game's name, or "the hub itself" if it's not one specific game.
      placeholder: Rival Arena
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How do we reproduce it?
      placeholder: |
        1. Open Rival Arena
        2. Pick Chaos
        3. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where were you playing?
      options:
        - The hosted site (mimi-games-bvpj.onrender.com)
        - Desktop app (Windows / macOS / Linux)
        - Android phone or tablet
        - Android TV
        - Meta Quest
        - Running it myself with node server.js
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 141 on Windows 11
  - type: textarea
    id: console
    attributes:
      label: Anything in the browser console?
      description: F12 → Console. Red errors are the useful ones. Optional, but it often pins the problem down immediately.
      render: text
